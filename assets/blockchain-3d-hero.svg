<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05051b"/><stop offset=".35" stop-color="#24105e"/><stop offset=".7" stop-color="#081d48"/><stop offset="1" stop-color="#061c2d"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".45" stop-color="#00e5ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7adf"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff08a"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#10b981"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity=".10"/></pattern>
 <radialGradient id="halo"><stop stop-color="#00e5ff" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/>
<ellipse cx="910" cy="150" rx="260" ry="150" fill="url(#halo)" opacity=".55"><animate attributeName="opacity" values=".35;.75;.35" dur="4s" repeatCount="indefinite"/></ellipse>
<g font-family="Trebuchet MS,Arial,sans-serif">
